<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Anmeldung · MI Präsentationen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ed7d31'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EMI%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/basis.css">
</head>
<body class="oberflaeche anmeldung">
  <main class="anmelde-karte">
    <h1>Medien und Informatik</h1>
    <p>Präsentationen 1. Sek. Bitte mit dem Passwort anmelden.</p>
    <form id="anmelden" autocomplete="on">
      <input type="text" name="username" value="Lehrperson" autocomplete="username" hidden>
      <div class="feld">
        <label for="passwort">Passwort</label>
        <input id="passwort" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <label class="ankreuzen"><input id="bleiben" type="checkbox"> Auf diesem Gerät angemeldet bleiben</label>
      <button class="knopf knopf-haupt" type="submit">Anmelden</button>
      <p id="meldung" class="meldung" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="js/krypto.js"></script>
  <script>
    (function () {
      var form = document.getElementById("anmelden");
      var meldung = document.getElementById("meldung");
      var knopf = form.querySelector("button");

      function weiterleiten() {
        var weiter = new URLSearchParams(location.search).get("weiter") || "";
        // Nur Seiten dieser Website zulassen
        if (!/^(start|praesentation)\.html(\?[^#]*)?(#.*)?$/.test(weiter)) weiter = "start.html";
        location.replace(weiter);
      }

      if (MiKrypto.angemeldet()) {
        MiKrypto.index().then(weiterleiten, function () {});
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        meldung.className = "meldung";
        meldung.textContent = "Wird geprüft …";
        knopf.disabled = true;
        MiKrypto.anmelden(form.passwort.value, document.getElementById("bleiben").checked)
          .then(weiterleiten)
          .catch(function (fehler) {
            meldung.className = "meldung fehler";
            meldung.textContent = fehler.message || "Anmeldung nicht möglich.";
            knopf.disabled = false;
            form.passwort.select();
          });
      });
    })();
  </script>
</body>
</html>
