# Baut alle Praesentationen mit allen Exporten und veroeffentlicht das Ergebnis
# mit GitHub Pages direkt aus diesem Repository.
#
# Einmalig einrichten: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Website bauen

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VEROEFFENTLICHEN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python-Pakete installieren
        run: pip install -r requirements.txt

      - name: Konverter testen
        run: python -m unittest discover tools/tests

      - name: Neue PowerPoint-Dateien in quellen/ umwandeln
        run: python tools/neue_quellen.py

      - name: Umgewandelte Dateien speichern
        if: env.VEROEFFENTLICHEN == 'true'
        run: |
          if [ -n "$(git status --porcelain inhalte/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add inhalte/
            git commit -m "Neue PowerPoint-Dateien automatisch umgewandelt [skip ci]"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Node-Pakete und Chromium installieren
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Website bauen (mit allen Exporten)
        run: node tools/build.mjs

      - name: Website im Browser pruefen
        run: node tools/pruefen.mjs

      - name: Exporte als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: exporte
          path: build/exporte
          retention-days: 7

      - name: Website fuer GitHub Pages bereitstellen
        if: env.VEROEFFENTLICHEN == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  veroeffentlichen:
    needs: bauen
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: pages
        uses: actions/deploy-pages@v4
